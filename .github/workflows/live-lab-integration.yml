# Live Strategy Lab PostgreSQL/Celery acceptance (manual / nightly).
name: Live Lab Integration

on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: propedge
          POSTGRES_PASSWORD: propedge_dev
          POSTGRES_DB: propedge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U propedge -d propedge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
      - name: Migrate
        working-directory: backend
        env:
          DATABASE_URL_SYNC: postgresql://propedge:propedge_dev@localhost:5432/propedge
        run: |
          . .venv/bin/activate
          alembic upgrade head
      - name: Unit suite
        working-directory: backend
        run: |
          . .venv/bin/activate
          pytest -q
      - name: Integration (Postgres E2E)
        working-directory: backend
        env:
          LIVE_LAB_INTEGRATION: "1"
          DATABASE_URL_SYNC: postgresql://propedge:propedge_dev@localhost:5432/propedge
          DATABASE_URL: postgresql+asyncpg://propedge:propedge_dev@localhost:5432/propedge
          REDIS_URL: redis://localhost:6379/0
        run: |
          . .venv/bin/activate
          pytest tests/test_live_lab_postgres_e2e.py -v --tb=short